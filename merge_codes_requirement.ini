改变一下工作流程。假设脚本名为merge_codes.python。
先帮我检查一下这个需求有没有什么漏洞或者信息不全。

==============================================

第一步，用户先输入指令扫描指定文件夹：
$ python merge_codes.python --scan [read_directory] --o [ini file name]
例如：
```
[User@Domin workspace]$ python merge_codes.python --scan /home/User/workspace --o /home/User/dics.ini
```
这会对/home/User/workspace目录进行扫描，按层级从高到低打印出指定目录下的所有目录的相对路径到 /home/User/dics.ini
例如如果workspace下有两个文件夹Denman1和Denman2,
```
workspace
    └── Denman1
        ├── build.sh
        ├── AndroidManifest.xml
        └── src
            └── BootstrapActivity.java
            └── RotationService.java
    └── Denman2
        ├── build.sh
        ├── AndroidManifest.xml
        └── src
            └── BootstrapActivity.java
            └── RotationService.java
```
那么输出的 /home/User/dics.ini 文件就会是：
```
[root]
/home/User/workspace

[layer1]
.

[layer2]
./Denman1
./Denman2

[layer3]
./Denman1/src
./Denman2/src
```

==============================================

第二步，用户用"##"（或者其他合适的符号）注释掉一部分路径，示意程序合并的层次。例如：
```
[root]
/home/User/workspace   # 未用"##"标注的其他所有文件合并输出至./Others.txt

[layer1]
.

[layer2]
./Denman1
##./Denman2   # 将./Denman2下的代码合并成一个文件并在输出文件夹的.目录放置-> 输出至目标文件夹的./Denman2.txt

[layer3]
##./Denman1/src # 将./Denman1/src下的代码合并成一个文件并在输出文件夹的.目录放置-> 输出至目标文件夹的./Denman1_src.txt
./Denman2/src
```

==============================================

第三步，用户输入指令读取ini文件将代码合并并输出到某个指定文件夹：
$ python merge_codes.python --merge [read_directory] --in [ini file name] --o [write_directory]
例如：
```
[User@Domin workspace]$ python merge_codes.python --merge /home/User/workspace --in /home/User/dics.ini --o /home/User/workspace_merged
```
那么会输出
/home/User/workspace_merged/Denman2.txt   包含/home/User/workspace/Denman2下所有代码合并后的内容
/home/User/workspace_merged/Denman1_src.txt   包含/home/User/workspace/Denman1/src下所有代码合并后的内容
/home/User/workspace_merged/Others.txt   包含其他所有代码合并后的内容

